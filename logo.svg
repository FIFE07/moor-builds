<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Moor Builds logo">
  <defs>
    <linearGradient id="mb-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F4BA8"/>
      <stop offset="1" stop-color="#2E63D6"/>
    </linearGradient>
  </defs>
  <style>
    .m { stroke-dasharray: 72; stroke-dashoffset: 72; animation: d 1.1s cubic-bezier(0.4,0,0.2,1) 0.25s forwards; }
    .o { transform: scale(0); transform-origin: center; transform-box: fill-box; animation: p 0.45s cubic-bezier(0.34,1.56,0.64,1) 1.15s forwards; }
    @keyframes d { to { stroke-dashoffset: 0; } }
    @keyframes p { to { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { .m { stroke-dashoffset: 0; animation: none; } .o { transform: scale(1); animation: none; } }
  </style>
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#mb-tile)"/>
  <path class="m" d="M14 33 V16 L24 27 L34 16 V33" fill="none" stroke="#FBFAF5" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="o" cx="34.5" cy="11" r="3.2" fill="#F5A623"/>
</svg>
